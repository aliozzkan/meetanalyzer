appId: com.meetanalyzing.app
productName: Meetanalyzing
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.cache,.scratch,docs,scripts}/**'
  # whisper-cli platforma göre ayrıdır; her platform yalnızca kendi klasörünü extraResources ile bin/ olarak alır.
  - '!resources/bin/**'
asarUnpack:
  - resources/**
win:
  executableName: meetanalyzing
  extraResources:
    - from: resources/bin/win32-x64
      to: bin
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: resources/bin/darwin-arm64
      to: bin
  extendInfo:
    NSMicrophoneUsageDescription: Meetanalyzing, toplantı seslerini kaydetmek için mikrofonunu kullanır. / Meetanalyzing uses your microphone to record meeting audio.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
